# Netlify Build and Deployment Configuration for Vite SPA
[build]
  publish = "dist"
  command = "npm run build"

# Cache headers for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all routes (SEC-14, v0.2)
# CSP is Report-Only on purpose: violations surface in the browser console
# without breaking the live app while the policy is validated.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://order-creator-be.onrender.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Missing asset files must 404, never fall through to the SPA HTML —
# an HTML body cached under a .js URL (immutable /assets/* headers)
# poisons the browser cache and blanks lazy-loaded pages.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# SPA Fallback rule so React Router handles deep routes (/order-creator, /catalog, /admin, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
